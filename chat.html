<!DOCTYPE HTML>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chativo</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="css/style.css">

    <link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#0A84FF">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="apple-mobile-web-app-title" content="Chativo">

</head>

<body>

<div class="app">

    <!-- ========================= -->
    <!-- SIDEBAR -->
    <!-- ========================= -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">

            <div class="logo">

                <i class="fa-solid fa-comments"></i>

                <span>Chativo</span>

            </div>

            <div class="header-actions">

                <button id="themeBtn" class="icon-btn">
                    <i class="fa-solid fa-moon"></i>
                </button>

                <button id="settingsBtn" class="icon-btn">
                    <i class="fa-solid fa-gear"></i>
                </button>

                <button id="logoutBtn" class="icon-btn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>

            </div>

        </div>

        <div class="sidebar-search">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                id="userSearch"
                type="text"
                placeholder="Search conversations">

        </div>

<div class="chat-filters">

    <button class="filter active" data-filter="all">
        All
    </button>

    <button class="filter" data-filter="unread">
        Unread
    </button>

    <button class="filter" data-filter="groups">
        Groups
    </button>

    <button class="filter" data-filter="favorites">
        ⭐
    </button>

</div>

        <div
            id="userList"
            class="user-list">

        </div>

<button
    id="newChatBtn"
    class="floating-chat-btn">

    <i class="fa-solid fa-pen"></i>

</button>

    </aside>

    <!-- ========================= -->
    <!-- CHAT -->
    <!-- ========================= -->

    <main
        class="chat"
        id="chatContainer">

        <header class="chat-header">

            <button
                id="backBtn"
                class="icon-btn mobile-only">

                <i class="fa-solid fa-arrow-left"></i>

            </button>

            <img
                id="chatPhoto"
                class="chat-avatar"
                src="https://ui-avatars.com/api/?name=User">

            <div class="chat-info">

    <h3 id="chatName">
        Select a conversation
    </h3>

    <div class="status-area">

    <span id="typingStatus"></span>

    <div class="status-row">

        <span id="onlineDot" class="online-dot"></span>

        <span id="lastSeen">Offline</span>

    </div>

</div>

    <div class="chat-badges">

        <span class="badge encrypted">

            <i class="fa-solid fa-lock"></i>

            End-to-End Encrypted

        </span>

    </div>

</div>

            <div class="chat-actions">

                <button
                    id="callBtn"
                    class="icon-btn">

                    <i class="fa-solid fa-phone"></i>

                </button>

        <button id="themeBtn" class="icon-btn" title="Toggle Theme">
    <i class="fa-solid fa-moon"></i>
</button>

                <button
                    id="videoBtn"
                    class="icon-btn">

                    <i class="fa-solid fa-video"></i>

                </button>

<button
    id="chatMenuBtn"
    class="icon-btn">

    <i class="fa-solid fa-ellipsis-vertical"></i>

</button>

            </div>

        </header>

        <div class="chat-search">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                id="searchMessage"
                placeholder="Search messages...">

        </div>

        <div
            id="welcomeScreen"
            class="welcome-screen">

            <div class="welcome-icon">

                <i class="fa-solid fa-comments"></i>

            </div>

            <h1>

Welcome to Chativo

</h1>

<p>

Fast • Secure • Beautiful Messaging

</p>

<button
class="start-chat-btn">

Start New Conversation

</button>

        </div>

<!-- ========================= -->
<!-- MESSAGES -->
<!-- ========================= -->
<div class="date-divider">

    <span>Today</span>

</div>

<section
    id="messages"
    class="messages">
</section>

<div
    id="typingAnimation"
    class="typing-animation">

    <span></span>
    <span></span>
    <span></span>

</div>

<!-- ========================= -->
<!-- COMPOSER -->
<!-- ========================= -->

<footer
    class="chat-composer">

<div id="replyPreview" class="reply-preview">

    <div class="reply-preview-content">

        <span class="reply-label">Replying to</span>

        <div id="replyPreviewText"></div>

    </div>

    <button id="cancelReplyBtn" class="icon-btn">

        <i class="fa-solid fa-xmark"></i>

    </button>

</div>

    <button
        id="emojiBtn"
        class="icon-btn">

        <i class="fa-regular fa-face-smile"></i>

    </button>

   <button
    id="attachBtn"
    class="icon-btn">

    <i class="fa-solid fa-paperclip"></i>

</button>

<button
    id="imageBtn"
    class="icon-btn">

    <i class="fa-regular fa-image"></i>

</button>

    <input
        id="imageInput"
        type="file"
        accept="image/*"
        hidden>

    <div class="message-box">

        <textarea
    id="message"
    rows="1"
    placeholder="Message"
    autocomplete="off"></textarea>

 <div id="typingPreview"></div>

    </div>

    <button
        id="voiceBtn"
        class="icon-btn">

        <i class="fa-solid fa-microphone"></i>

    </button>

    <button
        id="sendBtn"
        class="send-btn">

        <i class="fa-solid fa-paper-plane"></i>

    </button>

</footer>

<button id="scrollBottomBtn" class="scroll-bottom">

<i class="fa-solid fa-arrow-down"></i>

</button>

<!-- ========================= -->
<!-- EMOJI PICKER -->
<!-- ========================= -->

<div
    id="emojiPicker"
    class="emoji-picker">

    <span>😀</span>
    <span>😁</span>
    <span>😂</span>
    <span>🤣</span>
    <span>😍</span>
    <span>😊</span>
    <span>😎</span>
    <span>🥳</span>
    <span>🤩</span>
    <span>😢</span>
    <span>😭</span>
    <span>😡</span>
    <span>👍</span>
    <span>👏</span>
    <span>🙏</span>
    <span>❤️</span>
    <span>🔥</span>
    <span>🎉</span>

</div>

<!-- ========================= -->
<!-- MESSAGE MENU -->
<!-- ========================= -->

<div
    id="messageMenu"
    class="message-menu">

    <button id="copyMsg">
        <i class="fa-solid fa-copy"></i>
        <span>Copy</span>
    </button>

    <button id="replyMsg">
        <i class="fa-solid fa-reply"></i>
        <span>Reply</span>
    </button>

    <button id="editMsg">
        <i class="fa-solid fa-pen"></i>
        <span>Edit</span>
    </button>

    <button id="reactMsg">
        <i class="fa-regular fa-face-smile"></i>
        <span>React</span>
    </button>

    <button
        id="deleteMsg"
        class="danger">

        <i class="fa-solid fa-trash"></i>
        <span>Delete</span>

    </button>

</div>

<!-- ========================= -->
<!-- DELETE MODAL -->
<!-- ========================= -->

<div
    id="confirmModal"
    class="modal">

    <div class="modal-box">

        <h2>

            Delete Message?

        </h2>

        <p>

            This action cannot be undone.

        </p>

        <div class="modal-buttons">

            <button id="cancelDelete">

                Cancel

            </button>

            <button
                id="confirmDelete"
                class="danger">

                Delete

            </button>

        </div>

    </div>

</div>

<!-- ========================= -->
<!-- INCOMING CALL -->
<!-- ========================= -->

<div
    id="incomingCallModal"
    class="call-popup">

    <img
        id="incomingCallerPhoto"
        src="https://ui-avatars.com/api/?name=User">

    <h2 id="incomingCallerName">

        Incoming Call

    </h2>

    <div class="call-buttons">

        <button
            id="acceptCall"
            class="accept">

            <i class="fa-solid fa-phone"></i>

        </button>

        <button
            id="rejectCall"
            class="reject">

            <i class="fa-solid fa-phone-slash"></i>

        </button>

    </div>

</div>

<!-- ========================= -->
<!-- CALL SCREEN -->
<!-- ========================= -->

<div
    id="callScreen"
    class="call-screen">

    <img
        id="callAvatar"
        src="https://ui-avatars.com/api/?name=User">

    <h2 id="callName">

        User

    </h2>

    <p id="callTitle">

        Connecting...

    </p>

    <audio
        id="remoteAudio"
        autoplay>

    </audio>

    <button
        id="endCallBtn"
        class="end-call">

        <i class="fa-solid fa-phone-slash"></i>

    </button>

</div>

</main>

</div>


<div id="chatMenu" class="chat-menu">

    <button id="viewProfileBtn">
        <i class="fa-regular fa-user"></i>
        View Profile
    </button>

    <button id="clearChatBtn">
        <i class="fa-solid fa-broom"></i>
        Clear Chat
    </button>

    <button id="muteChatBtn">
        <i class="fa-solid fa-bell-slash"></i>
        Mute Notifications
    </button>

    <button id="blockUserBtn">
        <i class="fa-solid fa-ban"></i>
        Block User
    </button>

</div>

<script type="module" src="js/chat.js"></script>
<script type="module" src="js/sidebar.js"></script>
<script type="module" src="js/call.js"></script>
<script type="module" src="js/incomingCall.js"></script>
<script type="module" src="js/theme.js"></script>

</body>
</html>
