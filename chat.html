<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chativo</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/modern.css">

    <link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#0A84FF">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="apple-mobile-web-app-title" content="Chativo">

</head>

<body>

<div class="app">

    <!-- ================= Sidebar ================= -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">

            <div class="logo">

                <i class="fa-solid fa-comments"></i>

                <span>Chativo</span>

            </div>

            <button id="logoutBtn" class="icon-btn">

                <i class="fa-solid fa-right-from-bracket"></i>

            </button>

            <button id="themeBtn" class="icon-btn">
    <i class="fa-solid fa-moon"></i>
</button>

        </div>

        <div class="sidebar-search">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="userSearch"
                placeholder="Search users..."
            >

        </div>

        <div id="userList" class="user-list">

            <!-- Users loaded by sidebar.js -->

        </div>

    </aside>



    <!-- ================= Chat ================= -->

    <main class="chat" id="chatContainer">

    <!-- Chat Header -->

    <header class="chat-header">

        <button id="backBtn" class="icon-btn mobile-only">

            <i class="fa-solid fa-arrow-left"></i>

        </button>

        <img
            id="chatPhoto"
            class="chat-avatar"
            src="https://ui-avatars.com/api/?name=User"
            alt=""
        >

        <div class="chat-info">

            <h3 id="chatName">

                Select a chat

            </h3>

            <span id="typingStatus">

            </span>

        </div>

        <div class="chat-actions">

            <button
                id="callBtn"
                class="icon-btn"
            >
                <i class="fa-solid fa-phone"></i>
            </button>

            <button
                id="videoBtn"
                class="icon-btn"
            >
                <i class="fa-solid fa-video"></i>
            </button>

        </div>

    </header>


<div class="chat-search">

    <i class="fa-solid fa-magnifying-glass"></i>

    <input
        id="searchMessage"
        type="text"
        placeholder="Search messages..."
    >

</div>


    <!-- Messages -->

    <section
        id="messages"
        class="messages"
    >

    </section>



    <!-- Typing Indicator -->

    <div
        id="typingAnimation"
        class="typing-animation"
    >

        <span></span>

        <span></span>

        <span></span>

    </div>



    <footer class="chat-composer">

    <button id="emojiBtn" class="icon-btn">
        <i class="fa-regular fa-face-smile"></i>
    </button>

    <button id="imageBtn" class="icon-btn">
        <i class="fa-regular fa-image"></i>
    </button>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
        hidden
    >

    <div class="message-box">

        <input
            id="message"
            type="text"
            placeholder="Type a message..."
            autocomplete="off"
        >

    </div>

    <button id="voiceBtn" class="icon-btn">
        <i class="fa-solid fa-microphone"></i>
    </button>

    <button id="sendBtn" class="send-btn">
        <i class="fa-solid fa-paper-plane"></i>
    </button>

</footer>

<!-- Emoji Picker -->

<div id="emojiPicker" class="emoji-picker">

    <span>😀</span>
    <span>😁</span>
    <span>😂</span>
    <span>😍</span>
    <span>😊</span>
    <span>🥳</span>
    <span>👍</span>
    <span>❤️</span>
    <span>🔥</span>
    <span>👏</span>
    <span>🎉</span>
    <span>😎</span>

</div>

<div id="messageMenu" class="message-menu">

    <button id="copyMsg">
        <i class="fa-solid fa-copy"></i>
        Copy
    </button>

    <button id="replyMsg">
        <i class="fa-solid fa-reply"></i>
        Reply
    </button>

    <button id="editMsg">
        <i class="fa-solid fa-pen"></i>
        Edit
    </button>

    <button id="reactMsg">
        <i class="fa-solid fa-face-smile"></i>
        React
    </button>

    <button id="deleteMsg" class="danger">
        <i class="fa-solid fa-trash"></i>
        Delete
    </button>

</div>

<div id="confirmModal" class="modal">

    <div class="modal-box">

        <h3>Delete message?</h3>

        <p>This cannot be undone.</p>

        <div class="modal-buttons">

            <button id="cancelDelete">
                Cancel
            </button>

            <button id="confirmDelete" class="danger">
                Delete
            </button>

        </div>

    </div>

</div>

<div id="incomingCallModal" class="call-popup">

    <img
        id="incomingCallerPhoto"
        src="https://ui-avatars.com/api/?name=User"
    >

    <h2 id="incomingCallerName">
        Incoming Call
    </h2>

    <div class="call-buttons">

        <button id="acceptCall" class="accept">
            <i class="fa-solid fa-phone"></i>
        </button>

        <button id="rejectCall" class="reject">
            <i class="fa-solid fa-phone-slash"></i>
        </button>

    </div>

</div>

<div id="callScreen" class="call-screen">

    <img
        id="callAvatar"
        src="https://ui-avatars.com/api/?name=User"
    >

    <h2 id="callName">
        User
    </h2>

    <p id="callTitle">
        Connecting...
    </p>

    <audio id="remoteAudio" autoplay></audio>

    <button id="endCallBtn" class="end-call">

        <i class="fa-solid fa-phone-slash"></i>

    </button>

</div>

</main>

</div>

<script type="module" src="js/chat.js"></script>
<script type="module" src="js/incomingCall.js"></script>
<script type="module" src="js/call.js"></script>
<script type="module" src="js/sidebar.js"></script>
<script type="module" src="js/theme.js"></script>

</body>
